name: CI

on:
  push:
    branches:
      - main
      - 'release/**'
      - architecture-audit-modernization
  pull_request:
    branches:
      - main
      - 'release/**'

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    name: Lint, Test & Build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install dependencies
        run: npm ci --legacy-peer-deps

      - name: Typecheck & Lint
        run: npm run lint

      - name: Run Test Suite
        run: npm test

      - name: Verify Production Build
        run: npm run build

      - name: Verify prerendered pages hydrate cleanly
        run: npx vitest run src/__tests__/hydration.test.tsx
