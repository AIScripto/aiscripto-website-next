<!doctype html>
<html lang="en" class="dark">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <link rel="icon" href="/favicon.svg" />
  <script>
    (function () {
      try {
        var isExplicit = localStorage.getItem('theme_explicit') === 'true';
        var saved = localStorage.getItem('theme');
        // An explicit choice wins; otherwise follow the visitor's system setting.
        var systemLight = !isExplicit && window.matchMedia && window.matchMedia('(prefers-color-scheme: light)').matches;
        if ((isExplicit && saved === 'light') || systemLight) {
          document.documentElement.classList.remove('dark');
          document.documentElement.classList.add('light');
        } else {
          document.documentElement.classList.remove('light');
          document.documentElement.classList.add('dark');
        }
        var accent = localStorage.getItem('accent_theme');
        if (accent && /^(teal|cobalt|indigo|violet|emerald|amber|rose|slate)$/.test(accent)) {
          document.documentElement.setAttribute('data-accent', accent);
        } else {
          document.documentElement.setAttribute('data-accent', 'teal');
        }
      } catch (e) {
        document.documentElement.classList.add('dark');
      }
    })();
  </script>

  <script>
    window.dataLayer = window.dataLayer || [];
    function gtag() { dataLayer.push(arguments); }
    window.gtag = gtag;

    var analyticsLoaded = false;
    function loadAnalytics() {
      if (analyticsLoaded) return;
      analyticsLoaded = true;
      ['scroll', 'pointerdown', 'touchstart', 'keydown'].forEach(function (ev) {
        window.removeEventListener(ev, loadAnalytics);
      });
      var script = document.createElement('script');
      script.src = 'https://www.googletagmanager.com/gtag/js?id=G-ZGG48Z60PZ';
      script.async = true;
      document.head.appendChild(script);

      gtag('js', new Date());
      gtag('config', 'G-ZDN3RE88L3', { anonymize_ip: true });
      gtag('config', 'G-ZGG48Z60PZ', { anonymize_ip: true });
    }

    ['scroll', 'pointerdown', 'touchstart', 'keydown'].forEach(function (ev) {
      window.addEventListener(ev, loadAnalytics, { passive: true, once: true });
    });

    window.addEventListener('load', function () {
      if ('requestIdleCallback' in window) {
        window.requestIdleCallback(function () {
          setTimeout(loadAnalytics, 3500);
        });
      } else {
        setTimeout(loadAnalytics, 4000);

    });
